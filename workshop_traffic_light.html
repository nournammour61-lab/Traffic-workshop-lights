<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f4d3a" />
  <title>Workshop Traffic Light</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8f5;
      color: #17372b;
      min-height: 100vh;
    }
    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      text-align: center;
    }
    .badge {
      background: #1f4d3a;
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .6px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.1;
    }
    .subtitle {
      margin: 0 0 24px;
      color: #50625a;
      font-size: 16px;
      max-width: 420px;
    }
    .buttons {
      width: min(440px, 100%);
      display: grid;
      gap: 14px;
    }
    .choice {
      border: none;
      border-radius: 22px;
      padding: 24px 18px;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .choice small {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      opacity: .9;
    }
    .green { background: #39b54a; color: white; }
    .yellow { background: #ffd84d; color: #4a3b00; }
    .red { background: #e53935; color: white; }

    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 24px;
    }
    .screen.show { display: flex; }
    .screen .symbol {
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
    }
    .screen .label {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .screen .meaning {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    .back {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.85);
      background: rgba(0,0,0,.22);
      color: white;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
    }
    .yellow-screen .back {
      border-color: rgba(0,0,0,.35);
      color: #2f2900;
      background: rgba(255,255,255,.35);
    }
    .green-screen { background: #39b54a; color: white; }
    .yellow-screen { background: #ffd84d; color: #3d3200; }
    .red-screen { background: #e53935; color: white; }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #728079;
    }
  </style>
</head>
<body>
  <main id="home" class="home">
    <div class="badge">CLASSROOM MANAGEMENT WORKSHOP</div>
    <h1>Choose Your Color</h1>
    <p class="subtitle">
      Read the statement, choose your answer, then hold up your phone.
    </p>

    <div class="buttons">
      <button class="choice green" onclick="showColor('green')">
        GREEN
        <small>Always / Yes / I agree</small>
      </button>

      <button class="choice yellow" onclick="showColor('yellow')">
        YELLOW
        <small>Sometimes / Not sure</small>
      </button>

      <button class="choice red" onclick="showColor('red')">
        RED
        <small>Rarely / No / I disagree</small>
      </button>
    </div>

    <div class="footer">Tap a color to display it full screen.</div>
  </main>

  <section id="greenScreen" class="screen green-screen">
    <button class="back" onclick="goBack()">×</button>
    <div>
      <div class="symbol">✓</div>
      <div class="label">GREEN</div>
      <div class="meaning">Always / Yes / I agree</div>
    </div>
  </section>

  <section id="yellowScreen" class="screen yellow-screen">
    <button class="back" onclick="goBack()">×</button>
    <div>
      <div class="symbol">•</div>
      <div class="label">YELLOW</div>
      <div class="meaning">Sometimes / Not sure</div>
    </div>
  </section>

  <section id="redScreen" class="screen red-screen">
    <button class="back" onclick="goBack()">×</button>
    <div>
      <div class="symbol">×</div>
      <div class="label">RED</div>
      <div class="meaning">Rarely / No / I disagree</div>
    </div>
  </section>

  <script>
    function showColor(color) {
      document.getElementById('home').style.display = 'none';
      document.getElementById(color + 'Screen').classList.add('show');
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('show'));
      document.getElementById('home').style.display = 'flex';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
